name: Electron Build Workflow

on:
  push:
    branches:
      - '**'  # Trigger on push to any branch

jobs:
  build-linux:
    name: Build Linux Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Restore cached node_modules
        id: cache-node_modules-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ./node_modules
          key: ${{ runner.os }}-node_modules

      - name: Install dependencies
        run: npm install

      - name: Run build-linux task
        run: npm run build-linux

      - name: Save cached node_modules
        id: cache-node_modules-save
        uses: actions/cache/save@v4
        with:
          path: |
            ./node_modules
          key: ${{ runner.os }}-node_modules

      - name: Upload Linux Release Artifact
        uses: actions/upload-artifact@v4
        with:
            name: linux-release
            path: release/*.zip

  build-win32:
    name: Build Windows Artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Restore cached node_modules
        id: cache-node_modules-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ./node_modules
          key: ${{ runner.os }}-node_modules

      - name: Install dependencies
        run: npm install

      - name: Run build:release-win32-all task
        run: npm run build:release-win32-all
        continue-on-error: true
      - run: echo "OK"
        if: job.steps.bad.status == failure()

      - name: Save cached node_modules
        id: cache-node_modules-save
        uses: actions/cache/save@v4
        with:
          path: |
            ./node_modules
          key: ${{ runner.os }}-node_modules

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
            name: windows-release
            path: release/win-unpacked
